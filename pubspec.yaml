name: nimmys_crm
description: "NIMMYS CRM — leads, duties and follow ups for nimmys camera centre."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.12.1

  # State management. `flutter_bloc` re-exports `bloc`, so it is the only
  # entry needed; `equatable` keeps state comparison (and therefore widget
  # rebuild suppression) cheap and correct.
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking. Only Dio is listed: the app talks to the abstract `ApiClient`
  # in core/network, so swapping in a `package:http` implementation later
  # touches exactly one file and no feature code.
  dio: ^5.9.0

  # Service locator used for constructor injection at composition roots.
  get_it: ^8.0.3

  # Auth tokens live in the Keychain / EncryptedSharedPreferences, never in
  # SharedPreferences — see core/storage/token_storage.dart.
  flutter_secure_storage: ^9.2.4

  # Lets the app fail fast with a "no connection" message instead of waiting
  # out a full request timeout.
  connectivity_plus: ^6.1.5
  app_badge_plus: ^1.3.2
  awesome_notifications: ^0.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  go_router: ^17.3.0
  logger: ^2.7.0
  intl: ^0.20.3

  # Hands `tel:` URIs to the platform dialer so a follow-up can be called
  # straight from the list — see core/utils/phone_dialer.dart.
  url_launcher: ^6.3.2

  # Quotation sharing from the follow-up list: `pdf` renders the document,
  # `path_provider` gives it a temp file to live in, and `share_plus` hands
  # that file to WhatsApp (or whatever else the user picks) through the
  # platform share sheet — see features/leads/utils/quotation_pdf.dart.
  pdf: ^3.13.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2

  # Material has no WhatsApp glyph, and the follow-up row needs the real
  # brand mark to be recognisable at 38dp. Icon fonts are tree-shaken on
  # release builds, so only the glyphs actually used ship.
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Test doubles for repositories/clients and a harness that asserts on the
  # exact sequence of states a bloc emits.
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

# Launcher icon generation — run `dart run flutter_launcher_icons` after any
# change here. Source artwork: assets/logo/app_logo.png (1254x1254, opaque).
flutter_launcher_icons:
  image_path: "assets/logo/app_logo.png"

  # ---------------------------------------------------------------- Android
  # `true` overwrites the default @mipmap/ic_launcher that AndroidManifest.xml
  # already points at, so no manifest change is needed.
  android: true
  min_sdk_android: 24
  # Adaptive icon: the launcher applies its own mask, which is what gives the
  # icon rounded corners (or whatever shape the device uses) automatically.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/app_logo.png"
  # The artwork is full-bleed, so inset it into the adaptive safe zone. The
  # background is the same black as the artwork, so the padding is invisible.
  adaptive_icon_foreground_inset: 22

  # -------------------------------------------------------------------- iOS
  # No rounded corners are applied here — iOS masks the icon itself.
  ios: true
  # App Store icons must not contain an alpha channel; this flattens it if the
  # source ever gains transparency.
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Brand artwork. AppLogo reads nimmys_logo.png and falls back to a
  # painted lockup if the file is ever missing.
  #
  # `assets/images/nimmys_logo.png` is intentionally not listed: the file is
  # not in the repo, and declaring an asset that does not exist fails the
  # asset bundle for every build and test. AppLogo's `errorBuilder` renders
  # the painted lockup instead. Add the line back alongside the artwork.
  assets:
    - assets/logo/app_logo.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
